services:
  api:
    image: ghcr.io/wellrcosta/wreislab-nestjs-template:latest
    networks:
      - dokploy-network
    environment:
      NODE_ENV: production
      PORT: "3000"
      APP_NAME: ${APP_NAME}
      APP_URL: ${APP_URL:-}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      OIDC_JWKS_URI: ${OIDC_JWKS_URI:-}
      JWT_GROUPS_CLAIM: ${JWT_GROUPS_CLAIM:-groups}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.wreislab-api.rule=Host(`${APP_DOMAIN}`)"
        - "traefik.http.routers.wreislab-api.entrypoints=websecure"
        - "traefik.http.routers.wreislab-api.tls=true"
        - "traefik.http.services.wreislab-api.loadbalancer.server.port=3000"

networks:
  dokploy-network:
    external: true
